name: Release

# Builds Headroom and publishes a GitHub release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      # Only runs when a Developer ID certificate has been added as a secret.
      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        run: ./build.sh --release

      # The feed installed apps check for updates. Only written when the
      # update signing key has been added as a secret (Scripts/setup_updates.sh).
      - name: Write the update feed
        if: env.SPARKLE_PRIVATE_KEY != '' && github.ref_type == 'tag'
        run: |
          mkdir -p build/sparkle-tools
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz" \
            | tar -xJ -C build/sparkle-tools ./bin
          ZIP="dist/Headroom-$VERSION.zip"
          SIGNATURE="$(echo "$SPARKLE_PRIVATE_KEY" | build/sparkle-tools/bin/sign_update --ed-key-file - "$ZIP")"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Headroom-$VERSION.zip"
          PUBDATE="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Headroom</title>
              <item>
                <title>Headroom $VERSION</title>
                <pubDate>$PUBDATE</pubDate>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME</sparkle:releaseNotesLink>
                <enclosure url="$URL" $SIGNATURE type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          XML
          cat dist/appcast.xml

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(dist/*.zip dist/*.sha256)
          if [[ -f dist/appcast.xml ]]; then FILES+=(dist/appcast.xml); fi
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
            --title "Headroom $VERSION" --generate-notes

      - name: Keep the build (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Headroom-${{ env.VERSION }}
          path: dist/
